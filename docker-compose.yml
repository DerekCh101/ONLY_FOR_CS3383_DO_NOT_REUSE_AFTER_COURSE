# One command to run the whole backend:  docker compose up -d
# Then open http://localhost:3456 in a browser.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Scheduler
      POSTGRES_USER: postgres
      # Override by creating a .env file next to this file: POSTGRES_PASSWORD=...
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashore123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Scheduler"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: ./server
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-ashore123}
      PGDATABASE: Scheduler
      HostNodeServerListenToWherePort: 3456
      # Optional email (password reset). Leave unset to disable mail.
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: 587
      # SMTP_USER: you@gmail.com
      # SMTP_PASS: app-password
      # SMTP_FROM: you@gmail.com
    ports:
      - "3456:3456"
    volumes:
      # Typewriter images survive container rebuilds.
      - userfiles:/app/user-files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  userfiles:

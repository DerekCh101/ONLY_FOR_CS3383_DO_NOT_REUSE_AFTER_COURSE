name: CI, release, and server deployment

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the server image to GitHub Container Registry
        required: true
        default: false
        type: boolean
      deploy:
        description: Deploy the tagged server image to the configured host
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/scheduler-server

jobs:
  test-and-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build distributions (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean test jar cliJar distZip distTar

      - name: Run tests and build distributions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean test jar cliJar distZip distTar

      - name: Upload platform distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}
          path: |
            build/libs/*.jar
            build/distributions/*
          if-no-files-found: error

  server-test:
    name: Test server
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests when available
        working-directory: server
        run: npm test --if-present

  container:
    name: Build and publish server container
    needs: [test-and-build, server-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) || (github.event_name == 'workflow_dispatch' && inputs.publish_image)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) || (github.event_name == 'workflow_dispatch' && inputs.publish_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release-check:
    name: Check whether a release is needed
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    outputs:
      should_release: ${{ steps.release_check.outputs.should_release }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for functional changes
        id: release_check
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          if [[ -z "$latest_tag" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$latest_tag..$GITHUB_SHA" -- \
            'src/**' \
            'server/**' \
            'build.gradle.kts' \
            'settings.gradle.kts' \
            'gradle/**' \
            'docker-compose.yml'; then
            echo "No functional changes since $latest_tag; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Functional changes found since $latest_tag; creating release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Publish GitHub release
    needs: [test-and-build, server-test, release-check]
    runs-on: ubuntu-latest
    if: needs.release-check.outputs.should_release == 'true'
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            git fetch --tags --force
            latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
            if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              release_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              release_tag="v0.1.0"
            fi
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag "$release_tag" "$GITHUB_SHA"
            git push origin "$release_tag"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Download platform distributions
        uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          path: release-assets
          merge-multiple: false

      - name: Prepare uniquely named release assets
        shell: bash
        run: |
          mkdir release-assets-upload
          while IFS= read -r -d '' asset; do
            relative_path="${asset#release-assets/}"
            platform="${relative_path%%/*}"
            filename="$(basename "$asset")"
            cp "$asset" "release-assets-upload/${platform}-${filename}"
          done < <(find release-assets -type f -print0)

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets-upload/*
          fail_on_unmatched_files: true

  deploy:
    name: Deploy server container
    needs: container
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish_image && inputs.deploy))
    env:
      SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/scheduler-server:${{ github.ref_name }}
      GHCR_USERNAME: ${{ secrets.DEPLOY_REGISTRY_USERNAME }}
      GHCR_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Copy compose file to deployment host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull and restart server container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SERVER_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            SERVER_IMAGE="$SERVER_IMAGE" docker compose pull server
            SERVER_IMAGE="$SERVER_IMAGE" docker compose up -d --no-build postgres server
            docker image prune -f